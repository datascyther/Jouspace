# fly.toml — Jouspace Intelligence Runtime
#
# Deploys server/Dockerfile (a standard node:20-slim + tsx image).
# First-time setup (run in your own terminal, NOT the sandboxed VS Code terminal):
#   brew install flyctl
#   fly auth login
#   fly apps create jouspace-runtime        # or: fly launch
#   fly secrets set NVIDIA_API_KEY=sk-...    # required for real AI
# After that, every push to main deploys via .github/workflows/deploy-fly.yml.
#
# Want the exact https://jouspace.fly.dev URL from your Supabase config?
#   fly apps create jouspace               # if the name is free
#   or attach a custom domain in the Fly dashboard.

app = "jouspace-runtime"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"
  context = "server"

[env]
  PORT = "7860"
  NODE_ENV = "production"
  GATEWAY_PROVIDER = "nvidia"
  # Add your app's origin here (comma-separated). Dev/capacitor/localhost are always allowed.
  CORS_ORIGINS = "https://jouspace.fly.dev"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
