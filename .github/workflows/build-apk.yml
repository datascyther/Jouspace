# Build a SIGNED release Android APK — cloud build with zero local Android tooling.
#
# Trigger: Actions tab -> "Build Android APK" -> Run workflow, or push a tag
# like v1.0.0.
#
# For a SIGNED release build, add these GitHub Actions *secrets* to the repo
# (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  base64 of your upload-keystore.jks
#   ANDROID_KEY_ALIAS        key alias (e.g. upload)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
# If the keystore secret is absent the workflow falls back to a debug APK so
# the build still runs.
#
# KEYSTORE BACKUP: losing upload-keystore.jks means you can NEVER update an
# app installed from a previous release (users must uninstall first). Store the
# keystore + passwords somewhere safe (password manager, not just this repo).

name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Single source of truth for the conditional steps below.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web app dependencies
        # No root package-lock.json is committed, so use `npm install`.
        run: npm install

      - name: Build web app (single-file dist)
        # RUNTIME_URL (repo secret) bakes the hosted runtime URL into the APK so
        # the installed app reaches Jouspace Intelligence over HTTPS by default.
        # A user-supplied Profile URL still overrides this for dev/self-hosting.
        # Falls back to the deployed worker URL when the secret is unset.
        env:
          VITE_API_BASE_URL: ${{ secrets.RUNTIME_URL || 'https://jouspace-runtime.jouspace.workers.dev' }}
        run: npm run build

      - name: Install Capacitor + Android platform
        # Pin to v6 to match @capacitor/core ^6.1.0 in dependencies.
        run: npm i -D @capacitor/cli@^6 @capacitor/android@^6

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into native shell
        run: npx cap sync android

      - name: Declare native permissions (mic, notifications, wake lock)
        # capacitor.config.ts warns these must be declared natively or the OS
        # refuses runtime requests. Insert before </manifest> only if absent.
        run: |
          python3 - <<'PY'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          src = m.read_text()
          perms = [
            'android.permission.RECORD_AUDIO',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.WAKE_LOCK',
          ]
          inserts = '\n'.join(
            f'    <uses-permission android:name="{p}" />'
            for p in perms if f'"{p}"' not in src
          )
          if inserts:
            src = src.replace('</manifest>', inserts + '\n</manifest>', 1)
            m.write_text(src)
            print('added permissions:\n' + inserts)
          else:
            print('permissions already present')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Decode signing keystore (if provided)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks

      - name: Build release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=app/upload-keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build debug APK (no keystore secret)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: jouspace-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: jouspace-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
