# Supabase project configuration for Jouspace.
# Mirrors the auth/API settings we want on the hosted project. Auth provider
# secrets (Google/Apple) are injected via env vars at deploy time.

project_id = "jouspace"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
# Dev origin + your deployed PWA/APK origins.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/reset"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Require email confirmation (covers password sign-up + magic link).
enable_confirmations = true
double_confirm_changes = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "{{.SiteURL}}/auth/v1/callback"

[auth.external.apple]
# Postponed — enable once Apple Services ID + .p8 key are available.
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
redirect_uri = "{{.SiteURL}}/auth/v1/callback"

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
