# Build a SIGNED release Android APK — cloud build with zero local Android tooling.
#
# Trigger: Actions tab -> "Build Android APK" -> Run workflow (optionally
# passing a version to stamp), or push a tag like v1.0.5.
#
# The native Android shell (android/) is COMMITTED to the repo, including:
#   - the branded Jouspace adaptive icon set (drawable/, drawable-v24/,
#     mipmap-anydpi-v26/, mipmap-anydpi-v33/, per-density mipmaps, splash)
#   - the native permissions + jouspace:// deep-link in AndroidManifest.xml
#   - the release keystore (android/keystore/jouspace-release.keystore) and
#     its credentials (android/keystore.properties)
# Both `debug` and `release` build types sign with that committed keystore
# (see android/app/build.gradle), so EVERY build shares the SAME certificate
# and installs over previous builds — no more "App not installed as package
# conflicts with an existing package" and no default Capacitor icon.
#
# `npx cap sync android` only copies the web build + plugin files into the
# committed shell; it never touches the branded res/ tree or signing config.
#
# Versioning: SemVer with a pre-release tag. versionCode/versionName derive
# from the git tag (v1.1.0-beta.1 -> versionName "1.1.0-beta.1", versionCode
# 11001) or from the manual "version" input. versionCode layout:
#   MAJ * 10000 + MIN * 1000 + PAT * 100 + iteration
# where iteration is the beta number (01-99) for -beta.N builds and 100 for a
# stable release. So versionCode is strictly increasing across beta builds AND
# when the beta graduates to stable (1.1.0-beta.N -> 1100N, stable 1.1.0 ->
# 11100), and every later build upgrades over every earlier one.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 1.1.0-beta.1 or 1.1.0). Defaults to the latest git tag.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web app dependencies
        # No root package-lock.json is committed, so use `npm install`.
        # @capacitor/cli + @capacitor/android are devDependencies.
        run: npm install

      - name: Build web app (single-file dist)
        # RUNTIME_URL (repo secret) bakes the hosted runtime URL into the APK so
        # the installed app reaches Jouspace Intelligence over HTTPS by default.
        # A user-supplied Profile URL still overrides this for dev/self-hosting.
        # Falls back to the deployed worker URL when the secret is unset.
        env:
          VITE_API_BASE_URL: ${{ secrets.RUNTIME_URL || 'https://jouspace-runtime.jouspace.workers.dev' }}
        run: npm run build

      - name: Sync web assets into committed native shell
        run: npx cap sync android

      - name: Derive version from tag / input
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION:-1.1.0-beta.1}"
          BETA=""
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([0-9]+)$ ]]; then
            MAJ="${BASH_REMATCH[1]}"; MIN="${BASH_REMATCH[2]}"; PAT="${BASH_REMATCH[3]}"; BETA="${BASH_REMATCH[4]}"
          elif [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJ="${BASH_REMATCH[1]}"; MIN="${BASH_REMATCH[2]}"; PAT="${BASH_REMATCH[3]}"
          else
            MAJ="${VERSION%%.*}"; REST="${VERSION#*.}"
            MIN="${REST%%.*}"; PAT="${REST#*.}"
            PAT="${PAT%%[^0-9]*}"
            MAJ="${MAJ:-0}"; MIN="${MIN:-0}"; PAT="${PAT:-0}"
          fi
          BASE=$(( MAJ * 10000 + MIN * 1000 + PAT * 100 ))
          if [ -n "$BETA" ]; then
            VCODE=$(( BASE + BETA ))
          else
            VCODE=$(( BASE + 100 ))
          fi
          echo "versionName=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Derived versionName=$VERSION versionCode=$VCODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build release APK (signed with committed keystore)
        # The committed keystore + keystore.properties are picked up by
        # android/app/build.gradle. Passing -Pjouspace.versionCode/-Name
        # stamps the version; defaults are 11001 / "1.1.0-beta.1" if unset.
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pjouspace.versionCode=${{ steps.version.outputs.versionCode }} \
            -Pjouspace.versionName=${{ steps.version.outputs.versionName }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jouspace-release
          path: android/app/build/outputs/apk/release/app-release.apk
