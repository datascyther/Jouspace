# Cloudflare Worker for the Jouspace Intelligence Runtime.
# Free tier: no credit card required. Limits: 100k req/day, 10ms CPU time/req.
# Long AI streams are mostly wall-clock (awaiting NVIDIA), so they usually fit,
# but very long "deep" generations may hit the CPU ceiling — the worker fails
# gracefully with a clean SSE error.

name = "jouspace-runtime"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# Native fetch + Web Crypto; no Node.js compat needed.

# Secrets (set once via `wrangler secret put NVIDIA_API_KEY`):
#   NVIDIA_API_KEY  — required for real AI.

[vars]
GATEWAY_PROVIDER = "nvidia"
# CORS: allow all origins so any built app (PWA/APK, Capacitor schemes, custom
# domains) can call the worker without per-origin configuration. The worker is
# public + rate-limited, so a wildcard is acceptable here and removes a whole
# class of "AI silently fails because the origin wasn't whitelisted" faults.
CORS_ORIGINS = "*"

# Free tier keeps the worker awake-ish; no special config needed.
