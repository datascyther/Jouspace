# Build a SIGNED release Android APK — cloud build with zero local Android tooling.
#
# Trigger: Actions tab -> "Build Android APK" -> Run workflow, or push a tag
# like v1.0.0.
#
# For a SIGNED release build, add these GitHub Actions *secrets* to the repo
# (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  base64 of your upload-keystore.jks
#   ANDROID_KEY_ALIAS        key alias (e.g. upload)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
# If the keystore secret is absent the workflow falls back to a debug APK so
# the build still runs.
#
# KEYSTORE BACKUP: losing upload-keystore.jks means you can NEVER update an
# app installed from a previous release (users must uninstall first). Store the
# keystore + passwords somewhere safe (password manager, not just this repo).

name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Single source of truth for the conditional steps below.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web app dependencies
        # No root package-lock.json is committed, so use `npm install`.
        run: npm install

      - name: Build web app (single-file dist)
        # RUNTIME_URL (repo secret) bakes the hosted runtime URL into the APK so
        # the installed app reaches Jouspace Intelligence over HTTPS by default.
        # A user-supplied Profile URL still overrides this for dev/self-hosting.
        # Falls back to the deployed worker URL when the secret is unset.
        env:
          VITE_API_BASE_URL: ${{ secrets.RUNTIME_URL || 'https://jouspace-runtime.jouspace.workers.dev' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Install Capacitor + Android platform
        # Pin to v6 to match @capacitor/core ^6.1.0 in dependencies.
        run: npm i -D @capacitor/cli@^6 @capacitor/android@^6

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into native shell
        run: npx cap sync android

      - name: Apply custom Android icons and branding
        # Copy pre-built adaptive icon XML + launcher PNGs from the repo into
        # the generated android/ directory so the app ships with Jouspace
        # branding instead of the default Capacitor icon.
        # Uses the existing 192×192 PWA icon for all densities (Android
        # downscales at runtime; the adaptive-icon foreground layer is vector).
        run: |
          cp -f android-resources/ic_launcher.xml        android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp -f android-resources/ic_launcher_round.xml  android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp -f android-resources/ic_launcher.xml        android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          cp -f android-resources/ic_launcher_round.xml  android/app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml
          cp -f android-resources/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml
          # Use the existing PWA icon (192×192) as the raster fallback for
          # all densities. Android downscales at runtime — a larger source
          # is perfectly fine and avoids a resize-tool dependency.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dst="android/app/src/main/res/mipmap-${density}"
            if [ -d "$dst" ]; then
              cp -f public/icon-192.png "$dst/ic_launcher.png"
              cp -f public/icon-192.png "$dst/ic_launcher_round.png"
            fi
          done
          # Merge ic_launcher_background colour into values/colors.xml
          values_xml="android/app/src/main/res/values/colors.xml"
          if [ -f "$values_xml" ] && ! grep -q 'ic_launcher_background' "$values_xml"; then
            sed -i 's|</resources>|    <color name="ic_launcher_background">#F5F3EF</color>\n</resources>|' "$values_xml"
          elif [ ! -f "$values_xml" ]; then
            mkdir -p android/app/src/main/res/values
            cp -f android-resources/colors.xml "$values_xml"
          fi
          echo "Custom Jouspace icons applied"

      - name: Declare native permissions (mic, notifications, wake lock)
        # capacitor.config.ts warns these must be declared natively or the OS
        # refuses runtime requests. Insert before </manifest> only if absent.
        # Also adds a deep-link intent filter for jouspace:// so OAuth
        # callbacks route back into the app after Supabase redirects.
        run: |
          python3 - <<'PY'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          src = m.read_text()

          # ── Permissions ──
          perms = [
              'android.permission.RECORD_AUDIO',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.WAKE_LOCK',
          ]
          inserts = '\n'.join(
              f'    <uses-permission android:name="{p}" />'
              for p in perms if f'"{p}"' not in src
          )

          # ── Deep-link intent filter for jouspace:// OAuth callbacks ──
          intent_filter = '''
          <intent-filter android:autoVerify="true">
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="jouspace" />
          </intent-filter>'''

          if 'android.permission.RECORD_AUDIO' not in src:
              src = src.replace('</manifest>', inserts + '\n</manifest>', 1)
              print('added permissions:\n' + inserts)

          if 'jouspace' not in src:
              # Insert inside <activity> that has the MAIN/LAUNCHER filter
              marker = '<category android:name="android.intent.category.LAUNCHER" />'
              if marker in src:
                  src = src.replace(
                      marker,
                      marker + '\n' + intent_filter,
                      1,
                  )
                  print('added jouspace:// deep-link intent filter')
              else:
                  print('WARNING: could not find LAUNCHER category — skipping intent filter')
          else:
              print('intent filter already present')

          m.write_text(src)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Decode signing keystore (if provided)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks

      - name: Build release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=app/upload-keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build debug APK (no keystore secret)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: jouspace-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: jouspace-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
