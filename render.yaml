# Render Blueprint for the Jouspace Intelligence Runtime.
# Deploy: Render dashboard → New → Blueprint → connect this repo.
# Then set the NVIDIA_API_KEY secret in the service's Environment tab.
services:
  - type: web
    name: jouspace-runtime
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_PROVIDER
        value: nvidia
      - key: CORS_ORIGINS
        value: https://jouspace-runtime.onrender.com
      - key: NVIDIA_API_KEY
        sync: false
